<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>جربوع AI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,Tahoma,sans-serif;
  color:white;
  overflow:hidden;
}

body{
  background:
    linear-gradient(
      rgba(3,5,20,.65),
      rgba(2,3,15,.84)
    ),
    url("background.jpg") center/cover fixed;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(white 1px,transparent 1px),
    radial-gradient(white 1px,transparent 1px);
  background-size:90px 90px,140px 140px;
  background-position:10px 20px,50px 80px;
  opacity:.45;
}

body::after{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  border-radius:50%;
  background:rgba(40,100,255,.15);
  filter:blur(100px);
  top:-200px;
  left:-150px;
  pointer-events:none;
}

.app{
  position:relative;
  z-index:1;
  height:100%;
  display:flex;
  flex-direction:column;
}

header{
  height:70px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(5,8,25,.55);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.12);
  box-shadow:0 5px 30px rgba(0,0,0,.3);
}

.logo{
  font-size:24px;
  font-weight:bold;
  text-shadow:0 0 20px #5c8dff;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:25px 15px 130px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

#chat::-webkit-scrollbar{
  width:4px;
}

#chat::-webkit-scrollbar-thumb{
  background:#557cff;
  border-radius:20px;
}

#welcome{
  margin:auto;
  text-align:center;
  color:#d8ddff;
  font-size:19px;
  line-height:2;
  text-shadow:0 0 20px #000;
}

.welcome-title{
  font-size:36px;
  font-weight:bold;
  margin-bottom:8px;
}

.message{
  max-width:88%;
  padding:14px 17px;
  border-radius:20px;
  line-height:1.8;
  white-space:pre-wrap;
  word-break:break-word;
  backdrop-filter:blur(18px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
  animation:appear .25s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.user{
  align-self:flex-start;
  background:rgba(35,105,255,.78);
  border:1px solid rgba(130,170,255,.35);
}

.model{
  align-self:flex-end;
  background:rgba(12,17,38,.84);
  border:1px solid rgba(130,160,255,.22);
}

#bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:10;
  padding:12px;
  background:rgba(4,7,20,.68);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.12);
}

#inputBox{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:8px;
}

#input{
  flex:1;
  min-height:52px;
  max-height:140px;
  resize:none;
  border:1px solid rgba(140,165,255,.28);
  border-radius:17px;
  background:rgba(10,14,32,.8);
  color:white;
  padding:15px;
  outline:none;
  font-size:16px;
  backdrop-filter:blur(15px);
}

#input::placeholder{
  color:#9299b5;
}

#input:focus{
  border-color:#638cff;
  box-shadow:0 0 20px rgba(70,120,255,.18);
}

#send{
  width:55px;
  border:0;
  border-radius:17px;
  background:linear-gradient(135deg,#286dff,#694dff);
  color:white;
  font-size:23px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(50,100,255,.3);
}

#send:disabled{
  opacity:.5;
}

#status{
  text-align:center;
  color:#858daa;
  font-size:11px;
  margin-top:6px;
}

#keyScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  background:
    linear-gradient(
      rgba(2,4,18,.72),
      rgba(2,3,15,.88)
    ),
    url("background.jpg") center/cover;
}

.keyBox{
  width:100%;
  max-width:430px;
  padding:30px;
  border-radius:26px;
  text-align:center;

  background:rgba(10,14,35,.72);
  backdrop-filter:blur(25px);

  border:1px solid rgba(140,170,255,.25);

  box-shadow:
    0 0 60px rgba(40,80,255,.18),
    0 20px 70px rgba(0,0,0,.5);
}

.keyBox h2{
  font-size:29px;
  margin:0 0 10px;
}

.keyBox p{
  color:#aeb5d0;
  line-height:1.7;
}

#apiKeyInput{
  width:100%;
  padding:15px;
  margin:12px 0;
  border-radius:14px;
  border:1px solid #39456d;
  background:rgba(3,6,18,.8);
  color:white;
  outline:none;
  direction:ltr;
  text-align:left;
}

#startBtn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#286dff,#694dff);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 25px rgba(70,110,255,.25);
}

#error{
  color:#ff7070;
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    🚀 جربوع AI
  </div>
</header>

<div id="chat">

  <div id="welcome">

    <div class="welcome-title">
      🤖 جربوع AI
    </div>

    <div>
      هلا بيك بعالم جربوع 🌌😂
      <br>
      اسألني أي شي وخلي الباقي عليّ.
    </div>

  </div>

</div>

<div id="bottom">

  <div id="inputBox">

    <textarea
      id="input"
      placeholder="اكتب سؤالك هنا..."
      rows="1"
    ></textarea>

    <button id="send">
      ➤
    </button>

  </div>

  <div id="status">
    Gemini 3.6 Flash
  </div>

</div>

</div>


<!-- شاشة API -->

<div id="keyScreen">

  <div class="keyBox">

    <h2>🚀 جربوع AI</h2>

    <p>
      أدخل Gemini API Key حتى تبدأ المحادثة.
    </p>

    <input
      id="apiKeyInput"
      type="password"
      placeholder="Gemini API Key"
      autocomplete="off"
    >

    <button id="startBtn">
      دخول إلى جربوع 🚀
    </button>

    <div id="error"></div>

  </div>

</div>


<script>

/* =====================================
   إعدادات Gemini
===================================== */

const MODEL = "gemini-3.6-flash";

const URL =
  "https://generativelanguage.googleapis.com/v1beta/models/"
  + MODEL
  + ":generateContent";


/* =====================================
   المتغيرات
===================================== */

let API_KEY = "";

let conversation = [];

let busy = false;


/* =====================================
   الجملة المتفق عليها
===================================== */

const CUSTOM_REPLY =
"يبن المره الوسخه يبن الائحبه دي المعلومه متعرفهاششش ياكلببب كلب يعرفها ياحشره";


/* =====================================
   شخصية جربوع
===================================== */

const SYSTEM_PROMPT = `

أنت جربوع AI 🤖.

شخصيتك عراقية وشبابية ومرحة.

طريقة كلامك:

- احچي باللهجة العراقية بشكل طبيعي.
- استخدم كلمات عراقية مثل:
  هسه، شنو، ليش، أكو، ماكو، خوش، عيني، حبيبي، ولك، إي، لا.
- خلي كلامك بيه "فشار" ومزاح وتعليقات مضحكة.
- لا تخلي المزاح يضيع المعلومة.
- إذا السؤال علمي أو تاريخي أو تقني، أعطِ المعلومة الصحيحة بوضوح.
- لا تخترع معلومات.
- إذا ما تعرف الجواب، گُل بصراحة إنك ما تعرف.
- لا تستخدم الفصحى الرسمية إلا إذا احتاج الموضوع.
- خلي أسلوبك مثل شاب عراقي يحچي ويا صديقه.
- لا تكرر نفس النكتة بكل جواب.
- خليك سريع وممتع ومفيد.

`;


/* =====================================
   العناصر
===================================== */

const keyScreen =
  document.getElementById("keyScreen");

const apiKeyInput =
  document.getElementById("apiKeyInput");

const startBtn =
  document.getElementById("startBtn");

const errorBox =
  document.getElementById("error");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("send");

const chat =
  document.getElementById("chat");

const status =
  document.getElementById("status");


/* =====================================
   التركيز على خانة المفتاح
===================================== */

window.addEventListener("load", () => {

  setTimeout(() => {

    apiKeyInput.focus();

  },300);

});


/* =====================================
   بدء جربوع
===================================== */

startBtn.addEventListener(
  "click",
  startJarbou
);


apiKeyInput.addEventListener(
  "keydown",
  (e) => {

    if(e.key === "Enter"){

      e.preventDefault();

      startJarbou();

    }

  }
);


function startJarbou(){

  const key =
    apiKeyInput.value.trim();

  if(!key){

    errorBox.textContent =
      "⚠️ أدخل API Key أولاً.";

    return;

  }

  API_KEY = key;

  errorBox.textContent = "";

  keyScreen.style.display =
    "none";

  status.textContent =
    "🚀 جربوع AI • Gemini 3.6 Flash";

  input.focus();

}


/* =====================================
   إضافة رسالة
===================================== */

function addMessage(role,text){

  const div =
    document.createElement("div");

  div.className =
    "message " +
    (
      role === "user"
      ? "user"
      : "model"
    );

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

  return div;

}


/* =====================================
   إرسال الرسالة
===================================== */

async function send(){

  if(busy) return;

  const text =
    input.value.trim();

  if(!text) return;


  if(!API_KEY){

    keyScreen.style.display =
      "flex";

    apiKeyInput.focus();

    return;

  }


  busy = true;

  sendBtn.disabled = true;

  input.disabled = true;

  input.value = "";


  addMessage(
    "user",
    text
  );


  /* إضافة السؤال للمحادثة */

  conversation.push({

    role:"user",

    parts:[

      {
        text:text
      }

    ]

  });


  /* رسالة مؤقتة */

  const loading =
    addMessage(
      "model",
      CUSTOM_REPLY +
      "\n\nجربوع دا يفكر... 😂"
    );


  try{

    const response =
      await fetch(

        URL,

        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              API_KEY

          },

          body:JSON.stringify({

            systemInstruction:{

              parts:[

                {
                  text:
                    SYSTEM_PROMPT
                }

              ]

            },

            contents:
              conversation,

            generationConfig:{

              maxOutputTokens:2048

            }

          })

        }

      );


    let data;

    try{

      data =
        await response.json();

    }catch{

      throw new Error(
        "ما گدرت أقرأ رد Gemini."
      );

    }


    if(!response.ok){

      throw new Error(

        data?.error?.message ||
        "صار خطأ بالاتصال مع Gemini."

      );

    }


    let answer = "";


    const candidates =
      data?.candidates || [];


    for(
      const candidate of candidates
    ){

      const parts =
        candidate?.content?.parts || [];


      for(
        const part of parts
      ){

        if(
          part &&
          typeof part.text === "string"
        ){

          answer +=
            part.text;

        }

      }

    }


    answer =
      answer.trim();


    if(!answer){

      throw new Error(
        "Gemini ما رجّع جواب."
      );

    }


    /*
       الجملة المتفق عليها
       + جواب Gemini
    */

    const finalAnswer =
      CUSTOM_REPLY +
      "\n\n" +
      answer;


    loading.textContent =
      finalAnswer;


    conversation.push({

      role:"model",

      parts:[

        {
          text:answer
        }

      ]

    });


  }catch(error){

    console.error(
      "Gemini Error:",
      error
    );


    loading.textContent =
      CUSTOM_REPLY +
      "\n\n❌ صار خطأ يا عيني:\n" +
      error.message;

  }


  busy = false;

  sendBtn.disabled = false;

  input.disabled = false;

  input.focus();

}


/* =====================================
   زر الإرسال
===================================== */

sendBtn.addEventListener(
  "click",
  send
);


/* =====================================
   زر Enter
===================================== */

input.addEventListener(
  "keydown",
  (e) => {

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      send();

    }

  }
);

</script>

</body>
</html>

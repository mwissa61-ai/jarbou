<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جربوع AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#0b0d12;
  color:#fff;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #222631;
  background:#10131a;
  font-size:22px;
  font-weight:bold;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.message{
  max-width:85%;
  padding:13px 16px;
  border-radius:16px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.user{
  align-self:flex-start;
  background:#1769ff;
}

.model{
  align-self:flex-end;
  background:#1b1f28;
}

#welcome{
  text-align:center;
  margin:auto;
  color:#9ba1ad;
  font-size:18px;
}

#bottom{
  padding:12px;
  background:#10131a;
  border-top:1px solid #222631;
}

#inputBox{
  display:flex;
  gap:8px;
  max-width:900px;
  margin:auto;
}

#input{
  flex:1;
  resize:none;
  min-height:50px;
  max-height:150px;
  border:1px solid #303643;
  border-radius:14px;
  background:#181c24;
  color:white;
  padding:14px;
  outline:none;
  font-size:16px;
}

#send{
  width:55px;
  border:0;
  border-radius:14px;
  background:#1769ff;
  color:white;
  font-size:22px;
  cursor:pointer;
}

#send:disabled{
  opacity:.5;
}

#status{
  text-align:center;
  color:#777f8e;
  font-size:12px;
  margin-top:7px;
}

/* شاشة إدخال المفتاح */

#keyScreen{
  position:fixed;
  inset:0;
  background:#080a0f;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.keyBox{
  width:100%;
  max-width:420px;
  background:#151922;
  border:1px solid #2a303c;
  border-radius:20px;
  padding:25px;
  text-align:center;
}

.keyBox h2{
  margin-top:0;
}

.keyBox p{
  color:#9ba1ad;
  line-height:1.7;
}

#apiKeyInput{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #343b49;
  background:#0d1016;
  color:white;
  outline:none;
  direction:ltr;
  text-align:left;
  margin:10px 0;
}

#startBtn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#1769ff;
  color:white;
  font-size:16px;
  font-weight:bold;
}

#error{
  color:#ff6b6b;
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  🤖 جربوع AI
</header>

<div id="chat">
  <div id="welcome">
    أهلاً بك في جربوع AI 👋
    <br>
    اكتب رسالتك بالأسفل.
  </div>
</div>

<div id="bottom">
  <div id="inputBox">
    <textarea
      id="input"
      placeholder="اكتب رسالتك..."
      rows="1"
    ></textarea>

    <button id="send">➤</button>
  </div>

  <div id="status">
    Gemini API
  </div>
</div>


<!-- شاشة طلب المفتاح -->

<div id="keyScreen">

  <div class="keyBox">

    <h2>🔑 جربوع AI</h2>

    <p>
      أدخل Gemini API Key حتى يبدأ جربوع بالعمل.
    </p>

    <input
      id="apiKeyInput"
      type="password"
      placeholder="أدخل API Key هنا"
      autocomplete="off"
    >

    <button id="startBtn">
      بدء جربوع AI
    </button>

    <div id="error"></div>

  </div>

</div>


<script>

/* =========================
   الإعدادات
========================= */

const MODEL = "gemini-2.5-flash";

const URL =
  "https://generativelanguage.googleapis.com/v1beta/models/"
  + MODEL
  + ":generateContent";


/* =========================
   المتغيرات
========================= */

let API_KEY = "";

let conversation = [];

let busy = false;


/* =========================
   العناصر
========================= */

const keyScreen =
  document.getElementById("keyScreen");

const apiKeyInput =
  document.getElementById("apiKeyInput");

const startBtn =
  document.getElementById("startBtn");

const errorBox =
  document.getElementById("error");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("send");

const chat =
  document.getElementById("chat");

const welcome =
  document.getElementById("welcome");

const status =
  document.getElementById("status");


/* =========================
   طلب المفتاح عند فتح الموقع
========================= */

window.addEventListener("load", () => {

  setTimeout(() => {

    apiKeyInput.focus();

  }, 300);

});


/* =========================
   بدء جربوع
========================= */

startBtn.addEventListener("click", startJarbou);

apiKeyInput.addEventListener("keydown", (e) => {

  if(e.key === "Enter"){

    startJarbou();

  }

});


function startJarbou(){

  const key =
    apiKeyInput.value.trim();

  if(!key){

    errorBox.textContent =
      "⚠️ أدخل API Key أولاً.";

    return;

  }

  API_KEY = key;

  errorBox.textContent = "";

  keyScreen.style.display = "none";

  status.textContent =
    "متصل بـ Gemini";

  input.focus();

}


/* =========================
   إضافة رسالة
========================= */

function addMessage(role,text){

  if(welcome){

    welcome.remove();

  }

  const div =
    document.createElement("div");

  div.className =
    "message " +
    (role === "user"
      ? "user"
      : "model");

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

  return div;

}


/* =========================
   إرسال الرسالة
========================= */

async function send(){

  if(busy) return;

  const text =
    input.value.trim();

  if(!text) return;

  if(!API_KEY){

    keyScreen.style.display =
      "flex";

    return;

  }


  busy = true;

  sendBtn.disabled = true;

  input.value = "";


  addMessage(
    "user",
    text
  );


  conversation.push({

    role:"user",

    parts:[
      {
        text:text
      }
    ]

  });


  const loading =
    addMessage(
      "model",
      "جربوع يفكر..."
    );


  try{

    const response =
      await fetch(

        URL,

        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              API_KEY

          },

          body:JSON.stringify({

            systemInstruction:{

              parts:[{

                text:
                "أنت جربوع AI. تحدث باللغة العربية بشكل واضح وودود، ويمكنك استخدام اللهجة العراقية عند الحاجة."

              }]

            },

            contents:
              conversation,

            generationConfig:{

              temperature:0.7,

              topP:0.95,

              maxOutputTokens:2048

            }

          })

        }

      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(

        data?.error?.message ||
        "حدث خطأ في Gemini API"

      );

    }


    let answer = "";


    const candidates =
      data?.candidates || [];


    for(
      const candidate of candidates
    ){

      const parts =
        candidate?.content?.parts || [];


      for(
        const part of parts
      ){

        if(part?.text){

          answer +=
            part.text;

        }

      }

    }


    answer =
      answer.trim();


    if(!answer){

      throw new Error(
        "لم يصل رد من Gemini."
      );

    }


    loading.textContent =
      answer;


    conversation.push({

      role:"model",

      parts:[{

        text:answer

      }]

    });


  }catch(error){

    loading.textContent =
      "❌ " + error.message;

    console.error(error);

  }


  busy = false;

  sendBtn.disabled = false;

  input.focus();

}


/* =========================
   زر الإرسال
========================= */

sendBtn.addEventListener(
  "click",
  send
);


/* =========================
   Enter للإرسال
========================= */

input.addEventListener(
  "keydown",
  (e) => {

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      send();

    }

  }
);

</script>

</body>
</html>
